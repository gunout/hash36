<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D001A"/>
      <stop offset="100%" stop-color="#1A0033"/>
    </linearGradient>
    <linearGradient id="ftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D95"/>
      <stop offset="50%" stop-color="#FF69B4"/>
      <stop offset="100%" stop-color="#FFB6D9"/>
    </linearGradient>
    <filter id="ftGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="ftGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FF2D95" stroke-width="0.2" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1200" height="200" fill="url(#ftBg)"/>
  <rect width="1200" height="200" fill="url(#ftGrid)"/>

  <style>
    .ft-pulse { animation: ftPulse 3s ease-in-out infinite; }
    @keyframes ftPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .ft-blink { animation: ftBlink 1.5s step-end infinite; }
    @keyframes ftBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Ligne supérieure -->
  <line x1="100" y1="30" x2="1100" y2="30" stroke="url(#ftGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Cadenas décoratif -->
  <g transform="translate(600, 80)" filter="url(#ftGlow)">
    <rect x="-25" y="-10" width="50" height="40" rx="6" fill="none" stroke="#FF2D95" stroke-width="2"/>
    <path d="M -15 -10 L -15 -25 A 15 15 0 0 1 15 -25 L 15 -10" fill="none" stroke="#FF69B4" stroke-width="2"/>
    <circle cx="0" cy="8" r="4" fill="#FFB6D9"/>
    <line x1="0" y1="12" x2="0" y2="20" stroke="#FFB6D9" stroke-width="2"/>
  </g>

  <!-- Texte principal -->
  <text x="600" y="150" font-family="Orbitron, monospace" font-size="18" font-weight="700"
        fill="url(#ftGrad)" text-anchor="middle" letter-spacing="6" class="ft-pulse">
    HASH-36 · SECURE BY DESIGN
  </text>

  <!-- Ligne inférieure -->
  <line x1="100" y1="170" x2="1100" y2="170" stroke="url(#ftGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Copyright -->
  <text x="600" y="190" font-family="monospace" font-size="11" fill="#FFB6D9" text-anchor="middle"
        letter-spacing="3" opacity="0.6">
    © 2026 gunout · MIT License · <tspan class="ft-blink">_</tspan>
  </text>
</svg>
